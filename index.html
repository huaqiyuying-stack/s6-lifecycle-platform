<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目全生命周期历史档案与可视化平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f9fafb; color: #111827; }
        .header { background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 40; }
        .header-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #9333ea); display: flex; align-items: center; justify-content: center; color: #fff; }
        .logo-text { font-size: 18px; font-weight: 700; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .search-box { display: flex; align-items: center; background: #f3f4f6; border-radius: 8px; padding: 8px 12px; width: 256px; }
        .search-box input { border: none; background: transparent; margin-left: 8px; font-size: 14px; outline: none; width: 100%; }
        .btn-ai { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: #2563eb; color: #fff; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
        .btn-ai:hover { background: #1d4ed8; }
        .main { max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; }
        .sidebar { width: 220px; flex-shrink: 0; }
        .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 14px; color: #4b5563; border: none; background: transparent; width: 100%; text-align: left; }
        .nav-item:hover { background: #f3f4f6; }
        .nav-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 500; }
        .nav-icon { width: 20px; height: 20px; }
        .content { flex: 1; min-width: 0; }
        .card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 24px; margin-bottom: 24px; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 20px; }
        .stat-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .stat-icon.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
        .stat-icon.green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .stat-icon.purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
        .stat-icon.orange { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .stat-label { font-size: 14px; color: #6b7280; margin-top: 4px; }
        .stat-sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .info-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e7eb; }
        .info-item label { font-size: 12px; color: #6b7280; display: block; }
        .info-item span { font-size: 14px; font-weight: 500; margin-top: 4px; display: block; }
        .progress-bar { width: 100%; height: 10px; background: #e5e7eb; border-radius: 5px; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #2563eb); border-radius: 5px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-yellow { background: #fef9c3; color: #854d0e; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-gray { background: #f3f4f6; color: #4b5563; }
        .badge-red { background: #fee2e2; color: #dc2626; }
        .badge-purple { background: #f3e8ff; color: #7e22ce; }
        .badge-pink { background: #fce7f3; color: #be185d; }
        .badge-indigo { background: #e0e7ff; color: #3730a3; }
        .badge-cyan { background: #cffafe; color: #0e7490; }
        .badge-orange { background: #ffedd5; color: #c2410c; }
        .badge-teal { background: #ccfbf1; color: #0f766e; }
        .badge-lime { background: #ecfccb; color: #3f6212; }
        .badge-amber { background: #fef3c7; color: #92400e; }
        .badge-rose { background: #ffe4e6; color: #be123c; }
        .badge-sky { background: #e0f2fe; color: #075985; }
        .badge-violet { background: #ede9fe; color: #5b21b6; }
        .milestone-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f9fafb; border-radius: 8px; margin-bottom: 12px; }
        .milestone-item:hover { background: #f3f4f6; }
        .timeline { position: relative; padding-left: 48px; }
        .timeline::before { content: ''; position: absolute; left: 24px; top: 0; bottom: 0; width: 2px; background: #e5e7eb; }
        .timeline-item { position: relative; margin-bottom: 24px; }
        .timeline-dot { position: absolute; left: -36px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid; }
        .timeline-dot.completed { background: #f0fdf4; border-color: #bbf7d0; color: #22c55e; }
        .timeline-dot.in-progress { background: #eff6ff; border-color: #bfdbfe; color: #3b82f6; }
        .timeline-dot.planned { background: #f9fafb; border-color: #e5e7eb; color: #9ca3af; }
        .timeline-card { background: #f9fafb; border-radius: 8px; padding: 16px; }
        .timeline-card:hover { background: #f3f4f6; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 8px; font-size: 13px; color: #4b5563; font-weight: 500; border-bottom: 1px solid #e5e7eb; }
        td { padding: 12px 8px; font-size: 13px; border-bottom: 1px solid #f3f4f6; }
        tr:hover td { background: #f9fafb; }
        .tool-card { background: #f9fafb; border-radius: 8px; padding: 16px; display: flex; align-items: center; gap: 12px; }
        .tool-card:hover { background: #f3f4f6; }
        .tool-icon { font-size: 28px; }
        .flow-steps { display: flex; align-items: center; justify-content: space-between; overflow-x: auto; padding-bottom: 8px; }
        .flow-step { display: flex; flex-direction: column; align-items: center; min-width: 100px; }
        .flow-step-num { width: 48px; height: 48px; border-radius: 50%; background: #dbeafe; color: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .flow-step-label { font-size: 12px; color: #4b5563; margin-top: 8px; text-align: center; }
        .flow-arrow { color: #d1d5db; font-size: 18px; }
        .chart-container { width: 100%; height: 280px; position: relative; }
        .pie-chart-container { display: flex; align-items: center; gap: 24px; }
        .pie-legend { display: flex; flex-direction: column; gap: 8px; }
        .pie-legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .pie-legend-color { width: 12px; height: 12px; border-radius: 2px; }
        .chat-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; display: none; }
        .chat-overlay.show { display: block; }
        .chat-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 420px; background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,0.1); z-index: 50; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; }
        .chat-panel.show { transform: translateX(0); }
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid #e5e7eb; }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #9333ea); display: flex; align-items: center; justify-content: center; color: #fff; }
        .chat-online { font-size: 12px; color: #16a34a; display: flex; align-items: center; gap: 4px; }
        .chat-online-dot { width: 6px; height: 6px; background: #16a34a; border-radius: 50%; }
        .chat-close { padding: 8px; border-radius: 8px; border: none; background: transparent; cursor: pointer; }
        .chat-close:hover { background: #f3f4f6; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .chat-msg.ai { background: #f3f4f6; color: #111827; border-bottom-left-radius: 4px; align-self: flex-start; }
        .chat-msg.user { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
        .chat-input-area { padding: 16px; border-top: 1px solid #e5e7eb; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px 16px; background: #f3f4f6; border: none; border-radius: 12px; font-size: 14px; outline: none; }
        .chat-input:focus { box-shadow: 0 0 0 2px #3b82f6; }
        .chat-send { padding: 12px 16px; background: #2563eb; color: #fff; border: none; border-radius: 12px; cursor: pointer; }
        .chat-send:hover { background: #1d4ed8; }
        .chat-quick { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
        .chat-quick-btn { padding: 6px 12px; background: #f3f4f6; border: none; border-radius: 16px; font-size: 12px; color: #4b5563; cursor: pointer; white-space: nowrap; }
        .chat-quick-btn:hover { background: #e5e7eb; }
        .page { display: none; }
        .page.active { display: block; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
        .link-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 4px; }
        .link-btn:hover { color: #1d4ed8; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .card-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .charter-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 24px; margin-bottom: 16px; }
        .charter-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
        .charter-title-area { display: flex; align-items: center; gap: 12px; }
        .charter-icon { width: 40px; height: 40px; border-radius: 8px; background: #dbeafe; display: flex; align-items: center; justify-content: center; color: #2563eb; }
        .charter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .charter-field { background: #f9fafb; border-radius: 8px; padding: 16px; }
        .charter-field h4 { font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 8px; }
        .charter-field p { font-size: 13px; color: #4b5563; }
        .team-stat-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 24px; }
        .team-stat-gradient { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; }
        .data-source-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; font-size: 12px; color: #166534; }
        .data-source-badge svg { width: 14px; height: 14px; }
        .sprint-tag { display: inline-block; padding: 2px 8px; background: #fef3c7; color: #92400e; border-radius: 4px; font-size: 11px; margin-left: 8px; }
        @media (max-width: 1024px) {
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-2, .grid-4 { grid-template-columns: 1fr; }
            .info-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
                </div>
                <span class="logo-text">项目全生命周期档案平台</span>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" placeholder="搜索项目、文档...">
                </div>
                <button class="btn-ai" onclick="toggleChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                    AI助手
                </button>
            </div>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <nav>
                <button class="nav-item active" data-page="overview" onclick="switchPage('overview')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>
                    项目概览
                </button>
                <button class="nav-item" data-page="milestones" onclick="switchPage('milestones')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    里程碑
                </button>
                <button class="nav-item" data-page="team" onclick="switchPage('team')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    团队架构
                </button>
                <button class="nav-item" data-page="charters" onclick="switchPage('charters')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                    章程库
                </button>
                <button class="nav-item" data-page="tools" onclick="switchPage('tools')">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    工具栈
                </button>
            </nav>
        </aside>

        <div class="content">
            <div id="page-overview" class="page active fade-in">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
                    <span class="data-source-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                        数据来源: Teambition - S6&amp;S6G项目
                    </span>
                </div>
                <div class="stat-grid" id="stat-cards"></div>
                <div class="card" id="project-info-card"></div>
                <div class="grid-2">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                近期任务
                            </div>
                            <button class="link-btn" onclick="switchPage('milestones')">查看全部</button>
                        </div>
                        <div id="overview-tasks"></div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                                迭代趋势
                            </div>
                            <button class="link-btn" onclick="switchPage('milestones')">详细查看</button>
                        </div>
                        <div id="overview-chart" class="chart-container"></div>
                    </div>
                </div>
            </div>

            <div id="page-milestones" class="page fade-in">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
                    <h2 class="section-title" style="margin-bottom:0;">项目里程碑时间轴</h2>
                </div>
                <div class="card" style="margin-bottom:24px;">
                    <div id="milestone-timeline-visual" style="overflow-x:auto;padding:20px 0;"></div>
                </div>
                <div class="grid-4" style="margin-bottom:24px;" id="sprint-stats"></div>
                <div class="card">
                    <div style="max-height:600px;overflow-y:auto;">
                        <div class="timeline" id="sprint-timeline"></div>
                    </div>
                </div>
            </div>

            <div id="page-team" class="page fade-in">
                <h2 class="section-title">团队规模与架构</h2>
                <div style="margin-bottom:24px;max-width:320px;" id="team-stats"></div>
                <div class="grid-2" style="margin-bottom:24px;">
                    <div class="card" style="grid-column:1/-1;">
                        <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">角色分布（职能组）</h3>
                        <div id="team-pie-chart" style="display:flex;align-items:center;justify-content:center;height:280px;"></div>
                    </div>
                </div>
                <div class="card">
                    <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">项目成员列表</h3>
                    <div style="overflow-x:auto;">
                        <table>
                            <tbody id="members-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="page-charters" class="page fade-in">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
                    <h2 class="section-title" style="margin-bottom:0;">项目配置历史</h2>
                    <span style="font-size:14px;color:#6b7280;">共 <span id="charters-count">0</span> 个版本</span>
                </div>
                <div id="charters-list"></div>
            </div>

            <div id="page-tools" class="page fade-in">
                <h2 class="section-title">流程与工具栈</h2>
                <p style="font-size:14px;color:#4b5563;margin-bottom:24px;" id="workflow-info"></p>
                <div class="grid-2" style="margin-bottom:24px;" id="tools-grid"></div>
                <div class="card">
                    <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;">工作流类型</h3>
                    <div class="flow-steps" id="flow-steps"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-overlay" id="chat-overlay" onclick="toggleChat()"></div>
    <div class="chat-panel" id="chat-panel">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                </div>
                <div>
                    <h3 style="font-size:15px;font-weight:600;">AI 项目助手</h3>
                    <div class="chat-online"><span class="chat-online-dot"></span> 在线</div>
                </div>
            </div>
            <button class="chat-close" onclick="toggleChat()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-msg ai">您好！我是项目AI助手，可以回答关于S6&amp;S6G项目的任何问题。</div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-row">
                <input class="chat-input" id="chat-input" placeholder="输入您的问题..." onkeypress="if(event.key==='Enter')sendChat()">
                <button class="chat-send" onclick="sendChat()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </div>
            <div class="chat-quick">
                <button class="chat-quick-btn" onclick="quickChat('项目进度')">项目进度</button>
                <button class="chat-quick-btn" onclick="quickChat('团队人数')">团队人数</button>
                <button class="chat-quick-btn" onclick="quickChat('迭代情况')">迭代情况</button>
                <button class="chat-quick-btn" onclick="quickChat('工作流')">工作流</button>
            </div>
        </div>
    </div>

    function switchPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById('page-'+id).classList.add('active'); document.querySelector('[data-page="'+id+'"]').classList.add('active'); }
    function toggleChat() { document.getElementById('chat-overlay').classList.toggle('show'); document.getElementById('chat-panel').classList.toggle('show'); }
    function quickChat(t) { document.getElementById('chat-input').value=t; sendChat(); }
    function sendChat() {
        const inp=document.getElementById('chat-input'), txt=inp.value.trim(); if(!txt) return;
        const md=document.getElementById('chat-messages'); md.innerHTML+='<div class="chat-msg user">'+esc(txt)+'</div>'; inp.value='';
        setTimeout(()=>{
            const p=tbData.project,mc=tbData.members.length,tc=tbData.tasks.length,sc=tbData.sprints.length,ds=tbData.sprints.filter(s=>s.status==='complete').length;
            let r='';
            if(txt.includes('进度')) r='📈 项目进度：\n• 启动: '+p.startDate+'\n• 项目阶段: '+tbData.milestones.length+' 个\n• 里程碑节点: '+tbData.milestones.reduce((s,m)=>s+(m.subMilestones?m.subMilestones.length:1),0)+' 个\n• 活跃任务: '+tc+' 个\n• 团队: '+mc+' 人\n• 工作流: '+tbData.workflows.length+' 种';
            else if(txt.includes('里程碑')||txt.includes('阶段')){r='🏆 项目里程碑阶段：\n';tbData.milestones.forEach(m=>{r+='\n'+m.phase+' ('+m.startDate+' ~ '+m.endDate+')';if(m.subMilestones){m.subMilestones.forEach(sub=>{r+='\n  ├── '+sub.name+' ('+sub.startDate+' ~ '+sub.endDate+')';});}r+='\n';});}
            else if(txt.includes('团队')||txt.includes('人数')){
                const deptCount = {};
                tbData.members.forEach(m => {
                    if(!deptCount[m.dept]) deptCount[m.dept] = 0;
                    deptCount[m.dept]++;
                });
                r='👥 常驻团队（钉钉文档统计）：\n• 总人数: '+tbData.members.length+'人\n\n各职能组分布：\n';
                deptOrder.forEach(dept => {
                    if(deptCount[dept]) {
                        r+='• '+dept+': '+deptCount[dept]+'人\n';
                    }
                });
            }
            else if(txt.includes('迭代')) r='🔄 迭代：\n• 总数: '+sc+' 个\n• 已完成: '+ds+' 个\n• 时间: 2020年3月 - 2021年4月\n• 频率: 约每周1个';
            else if(txt.includes('任务')){r='📋 最新任务：\n';tbData.tasks.slice(0,5).forEach(t=>{r+='• #'+t.uniqueId+' '+t.content+'\n';});}
            else if(txt.includes('工作流')){r='🔧 工作流('+tbData.workflows.length+'种)：\n';tbData.workflows.forEach((w,i)=>{r+=(i+1)+'. '+w.name+'\n';});}
            else r='项目 "'+p.name+'"：\n• ID: '+p.id+'\n• 启动: '+p.startDate+'\n• 团队: '+mc+' 人\n• 迭代: '+sc+' 个\n• 工作流: '+tbData.workflows.length+' 种';
            md.innerHTML+='<div class="chat-msg ai">'+r+'</div>'; md.scrollTop=md.scrollHeight;
        },500); md.scrollTop=md.scrollHeight;
    }

    function renderAreaChart(){
        const c=document.getElementById('overview-chart'),md={};tbData.sprints.filter(s=>s.status==='complete'&&s.accomplished).forEach(s=>{const m=s.accomplished.substring(0,7);md[m]=(md[m]||0)+1;});
        const ms=Object.keys(md).sort();if(!ms.length){c.innerHTML='<p style="color:#9ca3af;text-align:center;padding:40px;">暂无数据</p>';return;}
        const vs=ms.map(m=>md[m]),mx=Math.max(...vs),W=c.offsetWidth||500,H=200,P=40;
        let svg='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+(H+30)+'">';
        for(let i=0;i<=4;i++){const y=P+(H-P)*(1-i/4);svg+='<line x1="'+P+'" y1="'+y+'" x2="'+(W-10)+'" y2="'+y+'" stroke="#e5e7eb" stroke-dasharray="3,3"/>';svg+='<text x="'+(P-5)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="#6b7280">'+Math.round(mx*i/4)+'</text>';}
        const pts=vs.map((v,i)=>({x:P+(W-P-10)*(i/(vs.length-1||1)),y:P+(H-P)*(1-v/(mx||1))}));
        if(pts.length>1){svg+='<path d="M'+pts[0].x+','+H+' L'+pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' L')+' L'+pts[pts.length-1].x+','+H+' Z" fill="#10b981" fill-opacity="0.15"/>';svg+='<path d="M'+pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' L')+'" fill="none" stroke="#10b981" stroke-width="2"/>';}
        pts.forEach((p,i)=>{svg+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="#10b981"/>';if(i%Math.ceil(ms.length/8)===0||i===ms.length-1)svg+='<text x="'+p.x.toFixed(1)+'" y="'+(H+18)+'" text-anchor="middle" font-size="9" fill="#6b7280">'+ms[i].substring(2)+'</text>';});
        svg+='</svg>';c.innerHTML=svg;
    }

    function renderSprintTimeline(){
        const milestones = tbData.milestones;
        document.getElementById('sprint-stats').innerHTML = '<div class="team-stat-card" style="text-align:center;"><div style="font-size:24px;font-weight:700;color:#16a34a;">'+milestones.length+'</div><div style="font-size:13px;color:#6b7280;margin-top:4px;">项目阶段</div></div><div class="team-stat-card" style="text-align:center;"><div style="font-size:24px;font-weight:700;color:#2563eb;">'+milestones.reduce((s,m)=>s+(m.subMilestones?m.subMilestones.length:1),0)+'</div><div style="font-size:13px;color:#6b7280;margin-top:4px;">里程碑节点</div></div><div class="team-stat-card" style="text-align:center;"><div style="font-size:24px;font-weight:700;color:#16a34a;">'+milestones.filter(m=>m.status==='completed').length+'</div><div style="font-size:13px;color:#6b7280;margin-top:4px;">已完成阶段</div></div><div class="team-stat-card" style="text-align:center;"><div style="font-size:24px;font-weight:700;color:#f59e0b;">'+milestones.filter(m=>m.status==='active').length+'</div><div style="font-size:13px;color:#6b7280;margin-top:4px;">进行中阶段</div></div>';
        const c=document.getElementById('sprint-timeline');
        c.innerHTML=milestones.map(phase=>{
            const icon = phase.status==='completed'?'✓':phase.status==='active'?'◉':'◷';
            const dotClass = phase.status==='completed'?'completed':phase.status==='active'?'planned':'planned';
            const badge = phase.status==='completed'?'<span class="badge badge-green">已完成</span>':phase.status==='active'?'<span class="badge badge-blue">运营中</span>':'<span class="badge badge-yellow">规划中</span>';
            let html = '<div class="timeline-item"><div class="timeline-dot '+dotClass+'">'+icon+'</div><div class="timeline-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><h4 style="font-size:14px;font-weight:600;">'+phase.phase+'</h4>'+badge+'</div><div style="display:flex;gap:16px;font-size:12px;color:#6b7280;"><span>开始: '+phase.startDate+'</span><span>结束: '+phase.endDate+'</span></div><p style="font-size:12px;color:#4b5563;margin-top:4px;">'+phase.description+'</p>';
            if(phase.subMilestones && phase.subMilestones.length > 0){
                html += '<div style="margin-top:12px;padding-left:16px;border-left:2px solid #e5e7eb;">';
                phase.subMilestones.forEach(sub=>{
                    const subIcon = sub.status==='completed'?'✓':sub.status==='planned'?'':'◷';
                    const subBadge = sub.status==='completed'?'<span class="badge badge-green" style="font-size:10px;">已完成</span>':sub.status==='planned'?'<span class="badge badge-blue" style="font-size:10px;">计划中</span>':'<span class="badge badge-yellow" style="font-size:10px;">待完成</span>';
                    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="color:'+(sub.status==='completed'?'#16a34a':'#3b82f6')+';font-size:12px;">'+subIcon+'</span><span style="font-size:13px;font-weight:500;flex:1;">'+sub.name+'</span><span style="font-size:11px;color:#6b7280;">'+sub.startDate+' ~ '+sub.endDate+'</span>'+subBadge+'</div>';
                });
                html += '</div>';
            }
            html += '</div></div>';
            return html;
        }).join('');
    }

    function renderPieChart(){
        const c=document.getElementById('team-pie-chart'),m=tbData.members;
        const deptCount = {};
        m.forEach(member => {
            if(!deptCount[member.dept]) deptCount[member.dept] = 0;
            deptCount[member.dept]++;
        });
        const data = deptOrder.filter(dept => deptCount[dept]).map(dept => ({
            name: dept, value: deptCount[dept], color: deptColorMap[dept]
        }));
        const total = data.reduce((s,d)=>s+d.value,0);
        let svg='<svg width="200" height="200" viewBox="-120 -120 240 240">',sa=0;
        data.forEach(d=>{const ea=sa+(d.value/total)*360,sr=(sa-90)*Math.PI/180,er=(ea-90)*Math.PI/180,x1=Math.cos(sr)*100,y1=Math.sin(sr)*100,x2=Math.cos(er)*100,y2=Math.sin(er)*100,la=(ea-sa)>180?1:0;svg+='<path d="M 0 0 L '+x1+' '+y1+' A 100 100 0 '+la+' 1 '+x2+' '+y2+' Z" fill="'+d.color+'" stroke="#fff" stroke-width="2"/>';sa=ea;});
        svg+='</svg>';c.innerHTML='<div class="pie-chart-container">'+svg+'<div class="pie-legend">'+data.map(d=>'<div class="pie-legend-item"><span class="pie-legend-color" style="background:'+d.color+';"></span>'+d.name+' '+d.value+'人 ('+Math.round(d.value/total*100)+'%)</div>').join('')+'</div></div>';
    }

    function renderMembersTable(){
        const m=tbData.members;
        const sorted = [...m].sort((a,b) => {
            const idxA = deptOrder.indexOf(a.dept);
            const idxB = deptOrder.indexOf(b.dept);
            if(idxA !== idxB) return idxA - idxB;
            return a.name.localeCompare(b.name, 'zh');
        });
        document.getElementById('members-table').innerHTML=
            '<thead><tr><th style="width:50px;">序号</th><th style="width:120px;">职能组</th><th>姓名</th></tr></thead><tbody>'+
            sorted.map((member,i)=>{
                const colorClass = deptBadgeMap[member.dept] || 'badge-gray';
                return '<tr><td>'+(i+1)+'</td><td><span class="badge '+colorClass+'">'+member.dept+'</span></td><td style="font-weight:500;">'+member.name+'</td></tr>';
            }).join('')+'</tbody>';
    }

    function renderCharters(){
        const p=tbData.project,charters=[{version:'v1.0',date:p.startDate,author:'项目创建者',changes:'项目初始化 - S6&S6G游戏开发项目创建',goals:p.description,scope:'S6和S6G双模块游戏开发与迭代管理',constraints:'工作流: '+tbData.workflows.length+' 种 | 团队: '+tbData.members.length+' 人'},{version:'v2.0',date:'2021-06-02',author:'项目管理团队',changes:'新增需求/任务默认工作流，完善工作流体系',goals:'优化任务管理流程',scope:'引入标准化工作流模板',constraints:'14种工作流类型覆盖全生命周期'},{version:'v3.0',date:'2026-03-10',author:'项目管理团队',changes:'新增QA需求工作流，新增开发需求（含策划初步验收）工作流',goals:'提升质量和验收流程',scope:'QA和质量管理体系',constraints:'持续完善工作流'}];

    }

    function renderMilestoneTimeline(){
        const milestones = tbData.milestones;
        const c = document.getElementById('milestone-timeline-visual');
        let html = '<div style="min-width:800px;padding:20px 40px;position:relative;">';
        html += '<div style="position:relative;height:120px;margin-bottom:40px;">';
        html += '<div style="position:absolute;top:50px;left:0;right:0;height:3px;background:#e5e7eb;border-radius:2px;"></div>';
        const totalWidth = 100;
        const phaseWidth = totalWidth / milestones.length;
        milestones.forEach((phase, i) => {
            const leftPercent = i * phaseWidth + phaseWidth / 2;
            const color = phase.status === 'completed' ? '#16a34a' : phase.status === 'active' ? '#2563eb' : '#f59e0b';
            html += '<div style="position:absolute;left:'+leftPercent+'%;transform:translateX(-50%);text-align:center;">';
            html += '<div style="width:24px;height:24px;border-radius:50%;background:'+color+';border:4px solid #fff;box-shadow:0 0 0 2px '+color+';margin:0 auto 8px;"></div>';
            html += '<div style="font-size:14px;font-weight:600;color:#111827;margin-bottom:4px;">'+phase.phase+'</div>';
            html += '<div style="font-size:12px;color:'+color+';">'+phase.startDate+' ~ '+phase.endDate+'</div>';
            html += '</div>';
        });
        html += '</div>';
        milestones.forEach((phase, i) => {
            const color = phase.status === 'completed' ? '#16a34a' : phase.status === 'active' ? '#2563eb' : '#f59e0b';
            const bgColor = phase.status === 'completed' ? '#f0fdf4' : phase.status === 'active' ? '#eff6ff' : '#fffbeb';
            const borderColor = phase.status === 'completed' ? '#bbf7d0' : phase.status === 'active' ? '#bfdbfe' : '#fde68a';
            html += '<div style="background:'+bgColor+';border:1px solid '+borderColor+';border-radius:8px;padding:16px;margin-bottom:12px;">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
            html += '<div style="display:flex;align-items:center;gap:8px;">';
            html += '<div style="width:8px;height:8px;border-radius:50%;background:'+color+';"></div>';
            html += '<h4 style="font-size:15px;font-weight:600;color:#111827;">'+phase.phase+'</h4>';
            html += '</div>';
            html += '<span style="font-size:12px;color:'+color+';font-weight:500;">'+phase.startDate+' ~ '+phase.endDate+'</span>';
            html += '</div>';
            html += '<p style="font-size:13px;color:#4b5563;margin-bottom:12px;">'+phase.description+'</p>';
            if(phase.subMilestones && phase.subMilestones.length > 0){
                html += '<div style="display:flex;gap:12px;flex-wrap:wrap;">';
                phase.subMilestones.forEach(sub => {
                    const subColor = sub.status === 'completed' ? '#16a34a' : sub.status === 'active' ? '#2563eb' : '#f59e0b';
                    const subBg = sub.status === 'completed' ? '#dcfce7' : sub.status === 'active' ? '#dbeafe' : '#fef3c7';
                    html += '<div style="background:'+subBg+';border-radius:6px;padding:8px 12px;font-size:12px;">';
                    html += '<span style="color:'+subColor+';font-weight:500;">'+sub.name+'</span>';
                    html += '<span style="color:#6b7280;margin-left:4px;">('+sub.startDate+' ~ '+sub.endDate+')</span>';
                    html += '</div>';
                });
                html += '</div>';
            }
            html += '</div>';
        });
        html += '</div>';
        c.innerHTML = html;
    }
